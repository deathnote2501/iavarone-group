name: CI
on:
  pull_request:
    branches:
      - main
    # Pas de CI sur un changement sans code : documentation, bureautique et
    # rapports des routines (.*-logs/, dont .seo-boost-logs/, commités sur main par seo-boost
    # et conformite-vitrines). Même liste sur push et pull_request ; le dernier
    # motif qui correspond l'emporte.
    # Réintégrés : src/** (le code de l'app), docs/5-sources/design-v2-before-all.json (importé par
    # e2e/design-v2.spec.ts), public/** (servi tel quel, dont public/pricing.md)
    # et .github/**.
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!**.csv"
      - "!**.pdf"
      - "!**.docx"
      - "!**.doc"
      - "!**.xlsx"
      - "!**.xls"
      - "!**.ppt"
      - "!**.pptx"
      - "!**.odt"
      - "!**.ods"
      - "!**.odp"
      - "!.*-logs/**"
      - "src/**"
      - "docs/5-sources/design-v2-before-all.json"
      - "public/**"
      - ".github/**"
  push:
    branches:
      - main
    # Pas de CI sur un changement sans code : documentation, bureautique et
    # rapports des routines (.*-logs/, dont .seo-boost-logs/, commités sur main par seo-boost
    # et conformite-vitrines). Même liste sur push et pull_request ; le dernier
    # motif qui correspond l'emporte.
    # Réintégrés : src/** (le code de l'app), docs/5-sources/design-v2-before-all.json (importé par
    # e2e/design-v2.spec.ts), public/** (servi tel quel, dont public/pricing.md)
    # et .github/**.
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!**.csv"
      - "!**.pdf"
      - "!**.docx"
      - "!**.doc"
      - "!**.xlsx"
      - "!**.xls"
      - "!**.ppt"
      - "!**.pptx"
      - "!**.odt"
      - "!**.ods"
      - "!**.odp"
      - "!.*-logs/**"
      - "src/**"
      - "docs/5-sources/design-v2-before-all.json"
      - "public/**"
      - ".github/**"
  workflow_dispatch:
# Un run de main n'est jamais annulé (groupe propre à chaque commit) ;
# sur une PR, un nouveau push annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
  smoke:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
