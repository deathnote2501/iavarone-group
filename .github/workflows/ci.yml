name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Pas de CI sur un changement sans code : documentation, bureautique et
    # rapports des routines (.*-logs/, dont .seo-boost-logs/, commités sur main par seo-boost
    # et conformite-vitrines). Même liste sur push et pull_request ; le dernier
    # motif qui correspond l'emporte.
    # Réintégrés : src/** (le code de l'app), docs/5-sources/design-v2-before-all.json (importé par
    # e2e/design-v2.spec.ts), public/** (servi tel quel, dont public/pricing.md)
    # et .github/**.
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!**.csv"
      - "!**.pdf"
      - "!**.docx"
      - "!**.doc"
      - "!**.xlsx"
      - "!**.xls"
      - "!**.ppt"
      - "!**.pptx"
      - "!**.odt"
      - "!**.ods"
      - "!**.odp"
      - "!.*-logs/**"
      - "src/**"
      - "docs/5-sources/design-v2-before-all.json"
      - "public/**"
      - ".github/**"
  workflow_dispatch:
# Un run de main n'est jamais annulé (groupe propre à chaque commit) ;
# sur une PR, un nouveau push annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changements de code
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          code = True
          if os.environ["EVENT_NAME"] == "pull_request":
              files = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "HEAD^1", "HEAD"], text=True).splitlines()
              excluded = {".md", ".csv", ".pdf", ".docx", ".doc", ".xlsx", ".xls", ".ppt", ".pptx", ".odt", ".ods", ".odp"}
              def is_code(name):
                  if name.startswith(("src/", "public/", ".github/")) or name == "docs/5-sources/design-v2-before-all.json":
                      return True
                  return not (name.startswith("docs/") or pathlib.PurePosixPath(name).suffix in excluded or (name.startswith(".") and "-logs/" in name))
              code = any(map(is_code, files))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")
          PYCODE
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Verify (lint, types, audit, build, Playwright)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
